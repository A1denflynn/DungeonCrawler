<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dungeon Game</title>
<link rel="stylesheet" href="/css/style.css">

<style>
.void {
  background: #000;
  border: 1px solid #000;
}

#xp-bar-container {
  width: 200px;
  height: 10px;
  background: #222;
  border: 1px solid #555;
  margin: 5px 0;
}

#xp-bar {
  height: 100%;
  width: 0%;
  background: limegreen;
  transition: width 0.2s;
}
</style>
</head>

<body>

<h1>Dungeon Game</h1>

<div id="stats"></div>

<!-- XP BAR -->
<div id="xp-bar-container">
  <div id="xp-bar"></div>
</div>

<div id="message-log"></div>
<div id="dungeon-container"></div>

<div id="controls">
  <button onclick="move('w')">Up (W)</button>
  <button onclick="move('a')">Left (A)</button>
  <button onclick="move('s')">Down (S)</button>
  <button onclick="move('d')">Right (D)</button>
  <button onclick="toggleBackpack()">Open Backpack</button>
  <button onclick="openSkillTree()">Skill Tree</button>
</div>

<div id="backpack-panel">
  <h3>Backpack</h3>
  <div id="backpack"></div>
  <button onclick="toggleBackpack()">Close</button>
</div>

<script>

let dungeonState = null;
let backpackOpen = false;

// ---------- START ----------
function startGame(){
  fetch('/api/state')
    .then(res => res.json())
    .then(state => {
      if(state && state.dungeon){
        dungeonState = state;
        renderDungeon();
      } else {
        return fetch('/api/start')
          .then(r => r.json())
          .then(newState => {
            dungeonState = newState;
            renderDungeon();
          });
      }
    })
    .catch(() => {
      fetch('/api/start')
        .then(r => r.json())
        .then(newState => {
          dungeonState = newState;
          renderDungeon();
        });
    });
}
function openSkillTree(){
  window.location.href = "skilltree.html";
}

// ---------- MOVE ----------
function move(dir){
  if(backpackOpen || !dungeonState) return;

  fetch(`/api/move?direction=${dir}`, { method: 'POST' })
    .then(res => res.json())
    .then(data => {
      dungeonState = data;

      if(dungeonState.lastMoveResult === -2 || dungeonState.player.pendingCombat){
        window.location.href = 'combat.html';
        return;
      }

      renderDungeon();
    });
}

// ---------- RENDER ----------
function renderDungeon(){
  if(!dungeonState) return;

  const container = document.getElementById('dungeon-container');
  const stats = document.getElementById('stats');
  container.innerHTML = '';

  const p = dungeonState.player;
  const size = dungeonState.dungeon.length;
  const radius = 2;

  // ---------------- STATS ----------------
  stats.innerHTML = `
    HP: ${p.hp} | ATK: ${p.atk} | LUCK: ${p.luck}
    | LEVEL: ${p.level}
    | SP: ${p.skillPoints}
    <br>
    XP: ${p.xp} / ${p.xpToNext}
  `;

  // ---------------- XP BAR ----------------
  const xpPercent = (p.xp / p.xpToNext) * 100;
  document.getElementById('xp-bar').style.width = xpPercent + '%';

  // ---------------- DUNGEON RENDER ----------------
  for(let r = p.y - radius; r <= p.y + radius; r++){
    const rowDiv = document.createElement('div');
    rowDiv.className = 'row';

    for(let c = p.x - radius; c <= p.x + radius; c++){
      const cellDiv = document.createElement('div');
      cellDiv.className = 'cell';

      const distX = Math.abs(c - p.x);
      const distY = Math.abs(r - p.y);

      const isCenter = distX <= 1 && distY <= 1;

      if(r < 0 || c < 0 || r >= size || c >= size){
        cellDiv.classList.add('void');
      }
      else {
        const cell = dungeonState.dungeon[r][c];

        if(p.x === c && p.y === r){
          cellDiv.classList.add('player');
        }
        else if(!isCenter){
          cellDiv.classList.add('void');
        }
        else {
          if(cell === 1) cellDiv.classList.add('enemy');
          if(cell === 2) cellDiv.classList.add('trap');
          if(cell === 3) cellDiv.classList.add('loot');
          if(cell === 4) cellDiv.classList.add('exit');
        }
      }

      rowDiv.appendChild(cellDiv);
    }

    container.appendChild(rowDiv);
  }

  if(backpackOpen) renderBackpack();
}

// ---------- BACKPACK ----------
function toggleBackpack(){
  backpackOpen = !backpackOpen;
  document.getElementById('backpack-panel').style.display =
    backpackOpen ? 'block' : 'none';

  if(backpackOpen) renderBackpack();
}

function renderBackpack(){
  const container = document.getElementById('backpack');
  container.innerHTML = '';

  const items = dungeonState.player.backpack || [];

  if(items.length === 0){
    container.innerHTML = '<p>Empty</p>';
    return;
  }

  items.forEach((it, idx) => {
    const div = document.createElement('div');
    div.textContent = it.name;

    const btn = document.createElement('button');
    btn.textContent = 'Use';
    btn.onclick = () => useItem(idx);

    div.appendChild(btn);
    container.appendChild(div);
  });
}

function useItem(index){
  fetch(`/api/useItem?index=${index}`, { method: 'POST' })
    .then(r => r.json())
    .then(data => {
      dungeonState = data;
      renderDungeon();
    });
}

// ---------- KEYBOARD ----------
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();

  if(['w','a','s','d'].includes(k)){
    e.preventDefault();
    move(k);
  }
});

// ---------- INIT ----------
startGame();

</script>

</body>
</html>
